server {
  # Kein `listen [::]:80` — in Containern ohne IPv6 startet nginx damit nicht.
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Astro erzeugt eine statische 404-Seite
  error_page 404 /404.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    image/svg+xml
    application/xml+rss;

  # Cache-Steuerung bewusst über `expires` statt `add_header`:
  # ein add_header in einem location-Block ersetzt die geerbten Header
  # des server-Blocks, die Security-Header unten wären sonst weg.

  # Gehashte Build-Assets ändern sich nie
  location /_astro/ {
    expires 1y;
    try_files $uri =404;
  }

  # Bilder und Schriften
  location ~* \.(?:svg|png|jpe?g|webp|avif|ico|woff2?)$ {
    expires 30d;
    try_files $uri =404;
  }

  # HTML nie cachen, damit Deployments sofort greifen
  location / {
    expires -1;
    try_files $uri $uri/ $uri.html =404;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
